<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween 🎃</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }
  .card {
    background: #222;
    padding: 35px;
    border-radius: 20px;
    width: min(90%, 500px);
    box-shadow: 0 0 30px rgba(255,120,0,.25);
  }
  h1 { font-size: 2.2rem; }
  button {
    border: 0;
    border-radius: 12px;
    padding: 14px 24px;
    margin: 8px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  #yes { background: #ff7a00; color: white; }
  #no { background: #444; color: white; }

  #scare {
    display: none;
    position: fixed;
    inset: 0;
    background: #050505;
    z-index: 10;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #face {
    font-size: clamp(8rem, 35vw, 22rem);
    animation: shake .08s infinite alternate;
    user-select: none;
  }
  #scare p {
    font-size: clamp(1.2rem, 4vw, 2rem);
    margin: 0;
  }
  @keyframes shake {
    from { transform: translate(-5px, 3px) rotate(-2deg); }
    to   { transform: translate(5px, -3px) rotate(2deg); }
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎃 Halloween 🎃</h1>
  <p>Willst du eine kleine Halloween-Überraschung?</p>
  <button id="yes">Ja 😈</button>
  <button id="no">Nein</button>
</div>

<div id="scare" aria-hidden="true">
  <div id="face">😱</div>
  <p>BOO! 👻</p>
</div>

<script>
  const scare = document.getElementById("scare");

  document.getElementById("yes").addEventListener("click", () => {
    scare.style.display = "flex";
    scare.setAttribute("aria-hidden", "false");

    // Harmloser kurzer Ton, der erst nach dem Klick erzeugt wird.
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(65, ctx.currentTime + 0.45);

      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.45);
    }
  });

  document.getElementById("no").addEventListener("click", () => {
    alert("Okay 😄 Kein Jumpscare!");
  });

  // ESC beendet den Jumpscare.
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      scare.style.display = "none";
      scare.setAttribute("aria-hidden", "true");
    }
  });
</script>

</body>
</html>
